name: Test

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - name: Build and test
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          & ./scripts/Build.ps1 *>&1 | Tee-Object artifacts/build.log
          & ./scripts/Test-Shell.ps1 *>&1 | Tee-Object artifacts/shell.log
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-results
          path: |
            artifacts/*.log
            artifacts/gui-tests/
            artifacts/localization-tests-*/
            artifacts/installer-policy-*/
            artifacts/shell-smoke*/
            artifacts/release-tests-*/
          retention-days: 14
